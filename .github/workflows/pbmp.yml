name: PBMP conformance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  standalone-contract:
    runs-on: ubuntu-latest
    env:
      AMBOT_PBMP_SOCKET: ""
      AMBOT_BOTWEB_URL: ""
      AMBOT_BOTAI_URL: ""
      AMBOT_BOTLOGIC_URL: ""
      AMBOT_AMBNC_ENDPOINT: ""
    steps:
      - uses: actions/checkout@v4
      - name: Qualify standalone core with all integrations disabled
        run: |
          test -z "$AMBOT_PBMP_SOCKET"
          test -z "$AMBOT_BOTWEB_URL"
          test -z "$AMBOT_BOTAI_URL"
          test -z "$AMBOT_BOTLOGIC_URL"
          test -z "$AMBOT_AMBNC_ENDPOINT"
          make check

  pbmp-conformance:
    runs-on: ubuntu-latest
    env:
      AMBOT_PBMP_SOCKET: /tmp/ambot.pbmp.sock
    steps:
      - name: Checkout AmBot
        uses: actions/checkout@v4
      - name: Unit checks
        run: make check-pbmp
      - name: Build PBMP qualification endpoint
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Iinclude \
            ci/pbmp/qualification_server.c src/pbmp.c \
            -o /tmp/ambot-pbmp-qualification
      - name: Start PBMP qualification endpoint
        run: |
          /tmp/ambot-pbmp-qualification &
          for i in {1..100}; do
            test -S "$AMBOT_PBMP_SOCKET" && exit 0
            sleep 0.1
          done
          exit 1
      - name: Check out PBMP qualification suite
        uses: actions/checkout@v4
        with:
          repository: Ploos-AS/PBMP
          ref: v1.0.0
          path: .pbmp-suite
      - name: Qualify AmBot against PBMP/1
        run: |
          python3 .pbmp-suite/tools/qualify_endpoint.py \
            --socket "$AMBOT_PBMP_SOCKET" \
            --implementation-name ambot \
            --implementation-version "$GITHUB_SHA" \
            --output ambot-pbmp-conformance.json
          python3 -c 'import json; r=json.load(open("ambot-pbmp-conformance.json")); assert r["result"] == "pass"'
      - name: Upload PBMP conformance report
        uses: actions/upload-artifact@v4
        with:
          name: ambot-pbmp-v1.0.0-conformance
          path: ambot-pbmp-conformance.json
          if-no-files-found: error
